            already: 890,
            prayer: 1720

            return localStorage.getItem('blood_poll_voted') || null;
          });

          // Donor Prayers State
          const [donorVotes, setDonorVotes] = useState({});

          useEffect(() => {
            fetchData();
          }, []);

          useEffect(() => {
            localStorage.setItem('portal_theme', theme);
            if (theme === 'dark') {
              document.documentElement.classList.add('dark');
              document.body.className = "bg-slate-950 text-slate-100 min-h-screen selection:bg-rose-600 selection:text-white transition-colors duration-200";
            } else {
              document.documentElement.classList.remove('dark');
              document.body.className = "bg-slate-50 text-slate-900 min-h-screen selection:bg-rose-600 selection:text-white transition-colors duration-200";
            }
          }, [theme]);

          useEffect(() => {
            if (selectedCity) {
              localStorage.setItem('saved_blood_city', selectedCity);
              setDonorForm(prev => ({ ...prev, city: selectedCity }));
              setReqForm(prev => ({ ...prev, city: selectedCity }));
            }
          }, [selectedCity]);

          const fetchData = async () => {
            setLoading(true);
            try {
              const { data: dData } = await supabase.from('donors').select('*').order('id', { ascending: false });
              if (dData) setDonors(dData);
              const { data: rData } = await supabase.from('requests').select('*').order('id', { ascending: false });
              if (rData) setRequests(rData);
            } catch (e) {
              console.error(e);
            } finally {
              setLoading(false);
            }
          };

          const handleVoteOption = (key) => {
            if (hasVotedPoll) return;
            setPollVotes(prev => ({ ...prev, [key]: prev[key] + 1 }));
            setHasVotedPoll(key);
            localStorage.setItem('blood_poll_voted', key);

          const handleVoteForDonor = (donorId) => {
            const key = `donor_vote_${donorId}`;
            if (localStorage.getItem(key)) return;
            setDonorVotes(prev => ({ ...prev, [donorId]: (prev[donorId] || 15) + 1 }));
            localStorage.setItem(key, 'true');
          };

            const map = { "A+": 0, "A-": 0, "B+": 0, "B-": 0, "O+": 0, "O-": 0, "AB+": 0, "AB-": 0 };
            donors.forEach(d => {
              const bg = d.bloodgroup || d.bloodGroup;
              if (bg && map[bg] !== undefined) {
                if (!selectedCity || d.city === selectedCity) map[bg]++;
              }
            });
            return map;
          }, [donors, selectedCity]);

          const filteredDonors = useMemo(() => {
            return donors.filter(d => {
              const bg = d.bloodgroup || d.bloodGroup || '';
              const matchBlood = selectedBlood === 'All / تمام' || bg === selectedBlood;
              const matchCity = !selectedCity || d.city === selectedCity;

                const q = searchQuery.toLowerCase().trim();
                matchSearch = (d.name || '').toLowerCase().includes(q) ||

                              (d.tehsil || '').toLowerCase().includes(q) ||
                              bg.toLowerCase().includes(q);
              }
              return matchBlood && matchCity && matchSearch;
            });
          }, [donors, selectedBlood, selectedCity, searchQuery]);

          const backupDonors = useMemo(() => {
            const neighbors = nearbyCities[selectedCity] || [];
            if (neighbors.length === 0) return [];
            return donors.filter(d => {
              const isNeighbor = neighbors.includes(d.city);
              const bg = d.bloodgroup || d.bloodGroup || '';
              const matchBlood = selectedBlood === 'All / تمام' || bg === selectedBlood;
              return isNeighbor && matchBlood;
            });

                              <span className="w-12 h-12 rounded-2xl bg-amber-50 text-amber-700 border border-amber-300 font-black text-lg flex items-center justify-center">
                                {r.blood_group}
                              </span>
                              <div>
                                <h4 className={`font-bold text-base ${isDark ? 'text-white' : 'text-slate-900'}`}>{r.patient_name}</h4>
                                <p className={`text-xs ${isDark ? 'text-slate-400' : 'text-slate-500'}`}>🏥 {r.hospital}, {r.city}</p>
                              </div>
                            </div>
                            <span className="bg-rose-50 text-rose-600 border border-rose-200 text-[10px] px-2 py-0.5 rounded-full font-bold">
                              {r.urgency || 'فوری'}
                            </span>
                          </div>
                          <div className={`pt-3 border-t grid grid-cols-2 gap-2 ${isDark ? 'border-slate-800' : 'border-slate-100'}`}>
                            <a href={`https://wa.me/92${(r.contact || '').replace(/[^0-9]/g, '').slice(-10)}`} target="_blank" className="bg-emerald-50 text-emerald-700 border border-emerald-200 text-xs py-2 rounded-xl text-center font-bold">💬 واٹس ایپ</a>
                            <a href={`tel:${r.contact}`} className="bg-amber-500 text-slate-950 text-xs py-2 rounded-xl text-center font-black shadow-2xs">📞 کال کریں</a>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}

                  {/* COMMUNITY VOTE & PLEDGE POLL SECTION */}
                  <div className={`mt-12 border rounded-3xl p-6 sm:p-8 shadow-sm ${
                    isDark ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200'
                  }`}>
                    <div className={`flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 pb-4 border-b ${isDark ? 'border-slate-800' : 'border-slate-200'}`}>
                      <div>
                        <span className="text-rose-600 font-bold text-xs uppercase">عوامی رائے دہی و ووٹ</span>
                        <h3 className={`text-base sm:text-xl font-black ${isDark ? 'text-white' : 'text-slate-900'}`}>کیا آپ ضرورت پڑنے پر خون کا عطیہ دینے کے لیے تیار ہیں؟</h3>
                      </div>
                      <div className={`border px-4 py-2 rounded-2xl text-center ${isDark ? 'bg-slate-800 border-slate-700' : 'bg-slate-50 border-slate-200'}`}>
                        <span className="text-lg font-black text-rose-600">{totalPollVotes.toLocaleString()}</span>
                        <span className={`text-[11px] block font-semibold ${isDark ? 'text-slate-400' : 'text-slate-500'}`}>کل ووٹ</span>
                      </div>
                    </div>

                    <div className="mt-5 space-y-3">
                      {[
                        { key: 'pledge', icon: '🩸', text: 'ہاں! میں ایمرجنسی میں خون کا عطیہ دینے کا عہد کرتا ہوں ❤️', votes: pollVotes.pledge },
                        { key: 'already', icon: '🙌', text: 'میں پہلے بھی خون دے چکا ہوں اور دوبارہ بھی دوں گا 🏅', votes: pollVotes.already },
                        { key: 'prayer', icon: '✨', text: 'میں تمام مریضوں کے لیے شفاء کی دعا کرتا ہوں 🤲', votes: pollVotes.prayer }
                      ].map((item) => {
                        const percent = totalPollVotes > 0 ? Math.round((item.votes / totalPollVotes) * 100) : 0;
                        const isVoted = hasVotedPoll === item.key;
                        return (
                          <div
                            key={item.key}
                            onClick={() => handleVoteOption(item.key)}
                            className={`p-4 rounded-2xl border transition flex items-center justify-between cursor-pointer ${
                              isVoted
                                ? 'bg-rose-50 border-rose-500 ring-2 ring-rose-300'
                                : isDark ? 'bg-slate-950 border-slate-800 hover:border-rose-500' : 'bg-slate-50 border-slate-200 hover:border-rose-400'
                            }`}
                          >
                            <div className="flex items-center gap-3">
                              <span className="text-2xl">{item.icon}</span>
                              <div>
                                <h5 className={`font-bold text-sm ${isDark ? 'text-white' : 'text-slate-900'}`}>{item.text}</h5>
                                {hasVotedPoll && <span className={`text-xs font-semibold ${isDark ? 'text-slate-400' : 'text-slate-500'}`}>{item.votes.toLocaleString()} ووٹ</span>}
                              </div>
                            </div>
                            <div>
                              {hasVotedPoll ? (
                                <span className="bg-rose-600 text-white font-black text-xs px-3 py-1 rounded-xl shadow">{percent}%</span>
                              ) : (
                                <button className="bg-rose-600 text-white font-black text-xs px-4 py-2 rounded-xl shadow cursor-pointer">ووٹ دیں</button>
                              )}
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                </main>
              </div>

              {/* FOOTER */}
              <footer className={`border-t py-6 px-4 text-center text-xs ${isDark ? 'bg-slate-900 border-slate-800 text-slate-400' : 'bg-white border-slate-200 text-slate-500 shadow-2xs'}`}>
                <p>© 2026 پاکستان بلڈ پورٹل۔ انسانیت کی خدمت ہمارا نصب العین ہے۔</p>
              </footer>

              {/* REGISTER MODAL */}
              {showRegisterModal && (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-xs">
                  <div className={`w-full max-w-md border rounded-3xl p-6 shadow-2xl max-h-[90vh] overflow-y-auto ${isDark ? 'bg-slate-900 border-slate-800 text-slate-100' : 'bg-white border-slate-200 text-slate-900'}`}>

                      <button onClick={() => setShowRegisterModal(false)} className="text-slate-400 hover:text-rose-600 text-lg">✕</button>
                    </div>
                    <form onSubmit={handleRegisterSubmit} className="mt-4 space-y-3">
                      <div>
                        <label className="text-xs font-bold block mb-1">مکمل نام *</label>
                        <input type="text" required value={donorForm.name} onChange={e => setDonorForm({...donorForm, name: e.target.value})} className={`w-full border rounded-xl px-3 py-2 text-sm ${isDark ? 'bg-slate-950 border-slate-700 text-white' : 'bg-slate-50 border-slate-200 text-slate-900'}`} placeholder="مثال: محمد احمد" />
                      </div>
                      <div>
                        <label className="text-xs font-bold block mb-1">بلڈ گروپ *</label>
                        <select value={donorForm.bloodgroup} onChange={e => setDonorForm({...donorForm, bloodgroup: e.target.value})} className={`w-full border rounded-xl px-3 py-2 text-sm font-bold text-rose-600 ${isDark ? 'bg-slate-950 border-slate-700' : 'bg-slate-50 border-slate-200'}`}>
                          {bloodGroups.map(bg => <option key={bg} value={bg}>{bg}</option>)}
                        </select>
                      </div>
                      <div>
                        <label className="text-xs font-bold block mb-1">موبائل / واٹس ایپ نمبر *</label>
                        <input type="tel" required value={donorForm.phone} onChange={e => setDonorForm({...donorForm, phone: e.target.value})} className={`w-full border rounded-xl px-3 py-2 text-sm ${isDark ? 'bg-slate-950 border-slate-700 text-white' : 'bg-slate-50 border-slate-200 text-slate-900'}`} placeholder="03001234567" />
                      </div>
                      <div>
                        <label className="text-xs font-bold block mb-1">شہر *</label>
                        <select value={donorForm.city} onChange={e => setDonorForm({...donorForm, city: e.target.value})} className={`w-full border rounded-xl p-2 text-xs font-bold ${isDark ? 'bg-slate-950 border-slate-700 text-white' : 'bg-slate-50 border-slate-200 text-slate-900'}`}>
                          {pakistanProvinces["پنجاب / Punjab"].map(c => <option key={c} value={c}>{c}</option>)}
                        </select>
                      </div>
                      <div>
                        <label className="text-xs font-bold block mb-1">تحصیل یا محلہ (اختیاری)</label>
                        <input type="text" value={donorForm.tehsil} onChange={e => setDonorForm({...donorForm, tehsil: e.target.value})} placeholder="مثلاً: کبیروالا، میاں چنوں، کینٹ" className={`w-full border rounded-xl px-3 py-2 text-xs ${isDark ? 'bg-slate-950 border-slate-700 text-white' : 'bg-slate-50 border-slate-200 text-slate-900'}`} />
                      </div>
                      <button type="submit" className="w-full bg-rose-600 hover:bg-rose-500 text-white font-bold py-3 rounded-xl mt-3 shadow-md">
                        رجسٹریشن مکمل کریں
                      </button>
                    </form>
                  </div>
                </div>
              )}

              {/* POST REQUEST MODAL */}
              {showPostReqModal && (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-xs">
                  <div className={`w-full max-w-md border rounded-3xl p-6 shadow-2xl max-h-[90vh] overflow-y-auto ${isDark ? 'bg-slate-900 border-slate-800 text-slate-100' : 'bg-white border-slate-200 text-slate-900'}`}>
                    <div className={`flex justify-between items-center pb-3 border-b ${isDark ? 'border-slate-800' : 'border-slate-200'}`}>
                      <h3 className="font-bold text-base">خون کی ہنگامی ضرورت پوسٹ کریں</h3>
                      <button onClick={() => setShowPostReqModal(false)} className="text-slate-400 hover:text-rose-600 text-lg">✕</button>
                    </div>
                    <form onSubmit={handleRequestSubmit} className="mt-4 space-y-3">
                      <div>
                        <label className="text-xs font-bold block mb-1">مریض کا نام *</label>
                        <input type="text" required value={reqForm.patient_name} onChange={e => setReqForm({...reqForm, patient_name: e.target.value})} className={`w-full border rounded-xl px-3 py-2 text-sm ${isDark ? 'bg-slate-950 border-slate-700 text-white' : 'bg-slate-50 border-slate-200 text-slate-900'}`} placeholder="مریض کا نام" />
                      </div>
                      <div className="grid grid-cols-2 gap-2">
                        <div>
                          <label className="text-xs font-bold block mb-1">بلڈ گروپ *</label>
                          <select value={reqForm.blood_group} onChange={e => setReqForm({...reqForm, blood_group: e.target.value})} className={`w-full border rounded-xl px-3 py-2 text-sm font-bold text-rose-600 ${isDark ? 'bg-slate-950 border-slate-700' : 'bg-slate-50 border-slate-200'}`}>
                            {bloodGroups.map(bg => <option key={bg} value={bg}>{bg}</option>)}
                          </select>
                        </div>
                        <div>
                          <label className="text-xs font-bold block mb-1">شہر *</label>
                          <select value={reqForm.city} onChange={e => setReqForm({...reqForm, city: e.target.value})} className={`w-full border rounded-xl px-3 py-2 text-xs ${isDark ? 'bg-slate-950 border-slate-700 text-white' : 'bg-slate-50 border-slate-200 text-slate-900'}`}>
                            {pakistanProvinces["پنجاب / Punjab"].map(c => <option key={c} value={c}>{c}</option>)}
                          </select>
                        </div>
                      </div>
                      <div>
                        <label className="text-xs font-bold block mb-1">ہسپتال کا نام *</label>
                        <input type="text" required value={reqForm.hospital} onChange={e => setReqForm({...reqForm, hospital: e.target.value})} className={`w-full border rounded-xl px-3 py-2 text-sm ${isDark ? 'bg-slate-950 border-slate-700 text-white' : 'bg-slate-50 border-slate-200 text-slate-900'}`} placeholder="مثال: DHQ ہسپتال خانیوال" />
                      </div>
                      <div>
                        <label className="text-xs font-bold block mb-1">رابطہ نمبر (واٹس ایپ والا) *</label>
                        <input type="tel" required value={reqForm.contact} onChange={e => setReqForm({...reqForm, contact: e.target.value})} className={`w-full border rounded-xl px-3 py-2 text-sm ${isDark ? 'bg-slate-950 border-slate-700 text-white' : 'bg-slate-50 border-slate-200 text-slate-900'}`} placeholder="03001234567" />
                      </div>
                      <button type="submit" className="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-3 rounded-xl mt-3 shadow-md">
                        📢 اپیل جاری کریں
                      </button>
                    </form>
                  </div>
                </div>
              )}

              {selectedCampaign && (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 bg-black/75 backdrop-blur-xs">

                    isDark ? 'bg-slate-900 border-slate-800 text-slate-100' : 'bg-white border-slate-200 text-slate-900'
                  }`}>
                    <div className="relative h-48 sm:h-56 shrink-0 bg-slate-950">
                      <img src={selectedCampaign.image} alt={selectedCampaign.titleUrdu} className="w-full h-full object-cover" />
                      <div className="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/40 to-black/30" />
                      <button
                        onClick={() => setSelectedCampaign(null)}
                        className="absolute top-3 right-3 bg-black/60 hover:bg-black text-white w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold z-10"
                      >
                        ✕
                      </button>
                      <div className="absolute bottom-3 inset-x-4">
                        <span className={`inline-block text-[11px] font-black px-2.5 py-0.5 rounded-full text-white mb-1 shadow ${selectedCampaign.color}`}>
                          {selectedCampaign.icon} {selectedCampaign.tag}
                        </span>
                        <h3 className="text-base sm:text-lg font-black text-white leading-tight drop-shadow">
                          {lang === 'ur' ? selectedCampaign.titleUrdu : selectedCampaign.titleEn}
                        </h3>
                      </div>
                    </div>

                    <div className="p-4 sm:p-6 overflow-y-auto space-y-4">
                      <p className={`text-xs sm:text-sm leading-relaxed ${isDark ? 'text-slate-300' : 'text-slate-700'}`}>
                        {selectedCampaign.descUrdu}
                      </p>

                      {selectedCampaign.highlights && (
                        <div className={`p-3 sm:p-4 rounded-2xl border ${isDark ? 'bg-slate-950 border-slate-800' : 'bg-rose-50/60 border-rose-100'}`}>
                          <h4 className="text-xs font-black text-rose-600 mb-2 flex items-center gap-1.5">
                            <span>✨</span>
                            <span>اہم حقائق و رہنمائی:</span>
                          </h4>
                          <ul className="space-y-1.5 text-xs">
                            {selectedCampaign.highlights.map((h, i) => (
                              <li key={i} className="flex items-start gap-2">
                                <span className="text-rose-500 font-bold">•</span>
                                <span>{h}</span>
                              </li>
                            ))}
                          </ul>
                        </div>
                      )}

                      <div className="pt-2 flex items-center gap-2">
                        <button
                          onClick={() => {
                            setSelectedCampaign(null);
                            setShowRegisterModal(true);
                          }}
                          className="flex-1 bg-rose-600 hover:bg-rose-700 text-white font-black py-3 rounded-2xl text-xs sm:text-sm shadow-md flex items-center justify-center gap-2"
                        >
                          <span>❤️</span>
                          <span>میں ڈونر بن کر جان بچانا چاہتا ہوں</span>
                        </button>
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {/* EMERGENCY HELPLINES MODAL */}
              {showHelplinesModal && (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 bg-black/75 backdrop-blur-xs">
                  <div className={`w-full max-w-md border rounded-3xl p-5 shadow-2xl max-h-[90vh] overflow-y-auto ${
                    isDark ? 'bg-slate-900 border-slate-800 text-slate-100' : 'bg-white border-slate-200 text-slate-900'
                  }`}>
                    <div className="flex justify-between items-center pb-3 border-b border-slate-200 dark:border-slate-800">
                      <div className="flex items-center gap-2">
                        <span className="text-2xl">🚨</span>
                        <div>
                          <h3 className="font-black text-base">پاکستان ایمرجنسی و بلڈ ہیلپ لائنز</h3>
                          <p className="text-[10px] text-rose-600 font-bold">بغیر انٹرنیٹ کے بھی ڈائریکٹ کال کریں</p>
                        </div>
                      </div>
                      <button onClick={() => setShowHelplinesModal(false)} className="text-slate-400 hover:text-rose-600 text-lg">✕</button>
                    </div>

                    <div className="mt-4 space-y-2.5">
                      {[
                        { name: "ریسکیو 1122 (پنجاب، کے پی، سندھ)", num: "1122", desc: "فوری ایمبولینس و حادثاتی طبی امداد", icon: "🚑" },
                        { name: "ایدھی ایمبولینس سروس", num: "115", desc: "ملک گیر ایمبولینس نیٹ ورک", icon: "🚐" },
                        { name: "پاکستان ہلال احمر بلڈ بینک", num: "1030", desc: "سرکاری مصدقہ بلڈ سپلائی ہیلپ لائن", icon: "🩸" },
                        { name: "چھیپا ویلفیئر سروس", num: "1020", desc: "ایمرجنسی ریسکیو و ایمبولینس", icon: "🏥" },
                        { name: "فاطمید فاؤنڈیشن (تھلیسیمیا سنٹر)", num: "021-111-328-464", desc: "خون کی بیماریاں اور انتقال خون", icon: "❤️" },
                        { name: "سندس فاؤنڈیشن بلڈ سروس", num: "042-111-786-327", desc: "مفت خون کی فراہمی برائے تھیلیسیمیا", icon: "✨" }
                      ].map((hl, i) => (
                        <div key={i} className={`p-3 rounded-2xl border flex items-center justify-between gap-2 ${
                          isDark ? 'bg-slate-950 border-slate-800' : 'bg-slate-50 border-slate-200'
                        }`}>
                          <div className="min-w-0">
                            <h4 className="text-xs font-black flex items-center gap-1.5 truncate">
                              <span>{hl.icon}</span>
                              <span>{hl.name}</span>
                            </h4>
                            <p className="text-[10px] text-slate-500 truncate mt-0.5">{hl.desc}</p>
                          </div>
                          <a
                            href={`tel:${hl.num.replace(/[^0-9]/g, '')}`}
                            className="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-black px-3 py-1.5 rounded-xl shadow shrink-0 flex items-center gap-1"
                          >
                            <span>📞</span>
                            <span>{hl.num}</span>
                          </a>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              )}

              {/* NATIVE MOBILE STICKY BOTTOM APP NAVIGATION BAR */}
              <nav className={`sm:hidden fixed bottom-0 inset-x-0 z-40 border-t backdrop-blur-lg shadow-2xl px-2 py-1.5 flex items-center justify-around transition-colors ${
                isDark ? 'bg-slate-900/95 border-slate-800 text-slate-300' : 'bg-white/95 border-slate-200 text-slate-700'
              }`}>
                {/* Donors Tab */}
                <button
                  onClick={() => {
                    setActiveTab('donors');
                    window.scrollTo({ top: 380, behavior: 'smooth' });
                  }}
                  className={`flex flex-col items-center justify-center p-1 rounded-xl transition cursor-pointer flex-1 ${
                    activeTab === 'donors' ? 'text-rose-600 font-black' : 'text-slate-500'
                  }`}
                >
                  <span className="text-lg">🩸</span>
                  <span className="text-[10px] tracking-tight">{lang === 'ur' ? 'ڈونرز' : 'Donors'}</span>
                </button>

                {/* Emergency Blood Request */}
                <button
                  onClick={() => setShowPostReqModal(true)}
                  className="flex flex-col items-center justify-center p-1 rounded-xl text-amber-500 hover:text-amber-600 transition cursor-pointer flex-1"
                >
                  <span className="text-lg">🚨</span>
                  <span className="text-[10px] font-bold tracking-tight">{lang === 'ur' ? 'خون چاہیے' : 'Need Blood'}</span>
                </button>

                {/* Elevated Register Donor Center Button */}
                <button
                  onClick={() => setShowRegisterModal(true)}
                  className="-mt-5 bg-gradient-to-tr from-rose-600 via-rose-700 to-red-900 text-white w-12 h-12 rounded-full flex flex-col items-center justify-center shadow-lg shadow-rose-600/50 ring-4 ring-white dark:ring-slate-900 cursor-pointer active:scale-95 transition"
                >
                  <span className="text-xl font-bold leading-none">+</span>
                  <span className="text-[8px] font-black uppercase mt-0.5">{lang === 'ur' ? 'ڈونر' : 'Register'}</span>
                </button>

                {/* Helplines / 1122 */}
                <button
                  onClick={() => setShowHelplinesModal(true)}
                  className="flex flex-col items-center justify-center p-1 rounded-xl text-rose-500 hover:text-rose-600 transition cursor-pointer flex-1"
                >
                  <span className="text-lg">📞</span>
                  <span className="text-[10px] font-bold tracking-tight">{lang === 'ur' ? '1122 کال' : 'Helpline'}</span>
                </button>

                {/* Requests Tab */}
                <button
                  onClick={() => {
                    setActiveTab('requests');
                    window.scrollTo({ top: 380, behavior: 'smooth' });
                  }}
                  className={`flex flex-col items-center justify-center p-1 rounded-xl transition cursor-pointer flex-1 ${
                    activeTab === 'requests' ? 'text-amber-600 font-black' : 'text-slate-500'
                  }`}
                >
                  <span className="text-lg">📢</span>
                  <span className="text-[10px] font-bold tracking-tight">{lang === 'ur' ? 'اپیلیں' : 'Appeals'}</span>
                </button>
              </nav>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
