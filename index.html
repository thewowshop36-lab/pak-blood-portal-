                                  </div>
                                  <div className="pt-3 border-t border-slate-800 flex items-center justify-between">
                                    <span className="text-xs text-slate-400">{t.phone}</span>
                                    <a href={`tel:${donor.phone}`} className="bg-rose-500/10 hover:bg-rose-500 text-rose-400 hover:text-white px-3.5 py-1.5 rounded-xl text-xs font-bold border border-rose-500/20 transition">
                                      📞 {donor.phone}
                                    </a>
                                  </div>
                                </div>
                              ))}
                            </div>
                          )}
                        </div>
                      )}
                    </div>
                  )}

                  {activeTab === 'requests' && (
                    <div>
                      <div className="flex justify-between items-center mb-6">
                        <h3 className="text-lg font-bold text-white">{t.requestsTab}</h3>
                        <button onClick={() => setShowReqModal(true)} className="bg-amber-500 hover:bg-amber-400 text-slate-950 px-4 py-2 rounded-xl text-xs font-bold shadow transition">+ {t.postRequest}</button>
                      </div>

                      {requests.length === 0 ? (
                        <div className="bg-slate-900 rounded-2xl p-12 text-center border border-slate-800">
                          <h4 className="text-base font-bold text-slate-300">No emergency requests active right now.</h4>
                        </div>
                      ) : (
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                          {requests.map(req => (
                            <div key={req.id} className="bg-slate-900 rounded-2xl border border-amber-500/30 p-5 flex flex-col justify-between shadow-lg">
                              <div>
                                <div className="flex justify-between items-start mb-3">
                                  <div className="flex items-center gap-3">
                                    <div className="w-12 h-12 rounded-2xl bg-amber-500/10 text-amber-400 border border-amber-500/20 flex items-center justify-center font-extrabold text-lg">
                                      {req.blood_group}
                                    </div>
                                    <div>
                                      <h4 className="font-bold text-base text-white">{t.patient} {req.patient_name}</h4>
                                      <p className="text-xs text-slate-400">🏥 {req.hospital}, {req.city}</p>
                                    </div>
                                  </div>
                                  <span className="bg-rose-500/10 text-rose-400 border border-rose-500/20 text-[10px] px-2.5 py-1 rounded-full font-bold animate-pulse">
                                    {req.urgency}
                                  </span>
                                </div>
                              </div>
                              <div className="mt-4 pt-3 border-t border-slate-800 flex items-center justify-between">
                                <span className="text-xs text-slate-400">{t.phone}</span>
                                <a href={`tel:${req.contact}`} className="bg-amber-500/10 hover:bg-amber-500 text-amber-400 hover:text-slate-950 px-3.5 py-1.5 rounded-xl text-xs font-bold border border-amber-500/20 transition">
                                  📞 {req.contact}
                                </a>
                              </div>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  )}

                  {activeTab === 'admin' && (
                    <div className="max-w-3xl mx-auto bg-slate-900 rounded-2xl border border-slate-800 p-6 md:p-8 shadow-xl">
                      {!isAdminLoggedIn ? (
                        <div className="max-w-md mx-auto text-center py-6">
                          <h3 className="text-xl font-bold text-white mb-2">{t.adminLogin}</h3>
                          <p className="text-xs text-slate-400 mb-6">Restricted access for Platform Manager only</p>
                          <form onSubmit={(e) => { 
                            e.preventDefault(); 
                            if (adminPass === adminSecretPassword) { 
                              setIsAdminLoggedIn(true); 
                            } else { 
                              alert("Incorrect Password!"); 
                            } 
                          }} className="space-y-4">
                            <input type="password" placeholder={t.passwordPlaceholder} value={adminPass} onChange={(e) => setAdminPass(e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-sm text-center text-white outline-none focus:border-rose-500" />
                            <button type="submit" className="w-full bg-rose-600 hover:bg-rose-500 text-white py-3 rounded-xl font-bold text-xs shadow transition">{t.loginBtn}</button>
                          </form>
                        </div>
                      ) : (
                        <div>
                          <div className="flex justify-between items-center mb-6 pb-4 border-b border-slate-800">
                            <div>
                              <h3 className="text-lg font-bold text-white">Admin Control Panel</h3>
                              <p className="text-xs text-rose-400">Authorized Management</p>
                            </div>
                            <button onClick={() => { setIsAdminLoggedIn(false); setAdminPass(""); }} className="bg-slate-800 hover:bg-slate-700 text-rose-400 px-3 py-2 rounded-xl text-xs font-bold border border-slate-700">
                              {t.logoutBtn}
                            </button>
                          </div>
                          <div className="mb-6">
                            <h4 className="font-bold text-sm text-slate-300 mb-3">Registered Donors ({donors.length})</h4>
                            {donors.length === 0 ? <p className="text-xs text-slate-500 bg-slate-950 p-4 rounded-xl text-center">No donors found.</p> : (
                              <div className="space-y-2 max-h-48 overflow-y-auto">
                                {donors.map(d => (
                                  <div key={d.id} className="flex items-center justify-between bg-slate-950 p-3 rounded-xl border border-slate-800 text-xs">
                                    <span>{d.name} ({d.bloodgroup || d.bloodGroup}) - {d.city} - {d.phone}</span>
                                    <button onClick={() => handleDeleteDonor(d.id)} className="text-rose-400 hover:text-white px-2 py-1 rounded bg-rose-500/10">Delete</button>
                                  </div>
                                ))}
                              </div>
                            )}
                          </div>
                        </div>
                      )}
                    </div>
                  )}
                </main>
              </div>

              {showDonorModal && (
                <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 overflow-y-auto">
                  <div className="bg-slate-900 rounded-3xl max-w-lg w-full p-6 md:p-8 border border-slate-800 shadow-2xl relative">
                    <button onClick={() => setShowDonorModal(false)} className="absolute top-5 left-5 text-slate-400 hover:text-white text-xl">✕</button>
                    <h3 className="text-xl font-bold text-white mb-1">{t.registerDonor}</h3>
                    <p className="text-xs text-slate-400 mb-6">Enter your details to help patients in your city.</p>
                    <form onSubmit={handleRegisterDonor} className="space-y-4">
                      <div>
                        <label className="block text-xs font-semibold text-slate-300 mb-1.5">Full Name</label>
                        <input type="text" required placeholder="e.g. Muhammad Ahmad" value={newDonor.name} onChange={(e) => setNewDonor({...newDonor, name: e.target.value})} className="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-sm text-white outline-none focus:border-rose-500" />
                      </div>
                      <div className="grid grid-cols-2 gap-4">
                        <div>
                          <label className="block text-xs font-semibold text-slate-300 mb-1.5">{t.bloodGroup}</label>
                          <select value={newDonor.bloodgroup} onChange={(e) => setNewDonor({...newDonor, bloodgroup: e.target.value})} className="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-sm font-bold text-rose-400 outline-none">
                            {bloodGroups.filter(b => b !== "All / تمام").map(bg => <option key={bg} value={bg}>{bg}</option>)}
                          </select>
                        </div>
                        <div>
                          <label className="block text-xs font-semibold text-slate-300 mb-1.5">Phone Number</label>
                          <input type="text" required placeholder="03001234567" value={newDonor.phone} onChange={(e) => setNewDonor({...newDonor, phone: e.target.value})} className="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-sm text-white outline-none focus:border-rose-500" />
                        </div>
                      </div>
                      <div className="grid grid-cols-2 gap-4">
                        <div>
                          <label className="block text-xs font-semibold text-slate-300 mb-1.5">Province</label>
                          <select value={newDonor.province} onChange={(e) => { const prov = e.target.value; const cities = pakistanLocations[prov] || []; setNewDonor({...newDonor, province: prov, city: cities[0] || ""}); }} className="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-sm text-white outline-none">
                            {Object.keys(pakistanLocations).map(prov => <option key={prov} value={prov}>{prov}</option>)}
                          </select>
                        </div>
                        <div>
                          <label className="block text-xs font-semibold text-slate-300 mb-1.5">City</label>
                          <select value={newDonor.city} onChange={(e) => setNewDonor({...newDonor, city: e.target.value})} className="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-sm text-white outline-none">
                            {(pakistanLocations[newDonor.province] || []).map(city => <option key={city} value={city}>{city}</option>)}
                          </select>
                        </div>
                      </div>
                      <button type="submit" className="w-full bg-rose-600 hover:bg-rose-500 text-white py-3.5 rounded-xl font-bold text-sm shadow-lg shadow-rose-600/30 transition">Submit Registration</button>
                    </form>
                  </div>
                </div>
              )}

              {showReqModal && (
                <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 overflow-y-auto">
                  <div className="bg-slate-900 rounded-3xl max-w-lg w-full p-6 md:p-8 border border-slate-800 shadow-2xl relative">
                    <button onClick={() => setShowReqModal(false)} className="absolute top-5 left-5 text-slate-400 hover:text-white text-xl">✕</button>
                    <h3 className="text-xl font-bold text-white mb-1">{t.postRequest}</h3>
                    <p className="text-xs text-slate-400 mb-6">Broadcast emergency blood requirement.</p>
                    <form onSubmit={handlePostRequest} className="space-y-4">
                      <div>
                        <label className="block text-xs font-semibold text-slate-300 mb-1.5">Patient Name</label>
                        <input type="text" required placeholder="Patient Name" value={newReq.patient_name} onChange={(e) => setNewReq({...newReq, patient_name: e.target.value})} className="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-sm text-white outline-none focus:border-amber-500" />
                      </div>
                      <div className="grid grid-cols-2 gap-4">
                        <div>
                          <label className="block text-xs font-semibold text-slate-300 mb-1.5">Required Blood</label>
                          <select value={newReq.blood_group} onChange={(e) => setNewReq({...newReq, blood_group: e.target.value})} className="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-sm font-bold text-amber-400 outline-none">
                            {bloodGroups.filter(b => b !== "All / تمام").map(bg => <option key={bg} value={bg}>{bg}</option>)}
                          </select>
                        </div>
                        <div>
                          <label className="block text-xs font-semibold text-slate-300 mb-1.5">Contact Number</label>
                          <input type="text" required placeholder="03001234567" value={newReq.contact} onChange={(e) => setNewReq({...newReq, contact: e.target.value})} className="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-sm text-white outline-none focus:border-amber-500" />
                        </div>
                      </div>
                      <div className="grid grid-cols-2 gap-4">
                        <div>
                          <label className="block text-xs font-semibold text-slate-300 mb-1.5">Province</label>
                          <select value={newReq.province} onChange={(e) => { const prov = e.target.value; const cities = pakistanLocations[prov] || []; setNewReq({...newReq, province: prov, city: cities[0] || ""}); }} className="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-sm text-white outline-none">
                            {Object.keys(pakistanLocations).map(prov => <option key={prov} value={prov}>{prov}</option>)}
                          </select>
                        </div>
                        <div>
                          <label className="block text-xs font-semibold text-slate-300 mb-1.5">City</label>
                          <select value={newReq.city} onChange={(e) => setNewReq({...newReq, city: e.target.value})} className="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-sm text-white outline-none">
                            {(pakistanLocations[newReq.province] || []).map(city => <option key={city} value={city}>{city}</option>)}
                          </select>
                        </div>
                      </div>
                      <div>
                        <label className="block text-xs font-semibold text-slate-300 mb-1.5">Hospital & Address</label>
                        <input type="text" required placeholder="e.g. Nishtar Hospital, Multan" value={newReq.hospital} onChange={(e) => setNewReq({...newReq, hospital: e.target.value})} className="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-sm text-white outline-none focus:border-amber-500" />
                      </div>
                      <button type="submit" className="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 py-3.5 rounded-xl font-bold text-sm shadow-lg shadow-amber-500/20 transition">Post Emergency Request</button>
                    </form>
                  </div>
                </div>
              )}

              <footer className="bg-slate-900 border-t border-slate-800 py-8 mt-12 text-center text-xs space-y-2 text-slate-400">
                <p>{t.footerText}</p>
              </footer>
            </div>
          );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
